[alembic]
script_location = migrations
prepend_sys_path = src
sqlalchemy.url = postgresql+asyncpg://teacher_agent:change-me@localhost:5432/teacher_agent
[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
