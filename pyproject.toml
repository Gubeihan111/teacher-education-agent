[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teacher-education-agent"
version = "0.1.0"
description = "教师教育智能体工程骨架"
requires-python = ">=3.11"
dependencies = ["alembic>=1.14,<2", "asyncpg>=0.30,<1", "fastapi>=0.115,<1", "httpx>=0.28,<1", "langgraph>=0.2,<2", "langgraph-checkpoint-postgres>=2,<4", "openai>=1.70,<3", "pgvector>=0.3,<1", "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.7,<3", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-multipart>=0.0.20,<1", "sqlalchemy[asyncio]>=2.0,<3", "uvicorn>=0.34,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "apps"]
line-length = 100
